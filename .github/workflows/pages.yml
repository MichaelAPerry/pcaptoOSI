# Publish the visualiser to GitHub Pages.
#
# This is what makes the tool zero-install for students: once this workflow has
# run, the app lives at https://<owner>.github.io/<repo>/ and needs nothing but
# a browser. The build is entirely static and the app makes no network requests
# at runtime, so captures still never leave the student's machine.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build:single also runs the ordinary build, so dist/ ends up holding both
      # the hosted app and the standalone single-file download.
      - run: npm run build:single
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
