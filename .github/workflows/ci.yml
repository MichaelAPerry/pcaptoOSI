# Type-check, run the dissector self-check, and build on every push.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:single
      # Regenerating the bundled captures must be reproducible: if this leaves
      # the working tree dirty, src/data/samples.ts is out of step with the
      # generator that is supposed to produce it.
      - run: npm run samples && git diff --exit-code src/data/samples.ts
